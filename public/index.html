<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315b49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.png" type="image/png"><link rel="apple-touch-icon" href="/icon.png"><title>归物 · 家庭小仓库</title>
<style>
:root{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#253c32;background:#f5f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e4e7de;padding:22px max(5vw,20px);display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;letter-spacing:2px}.brand small{font-size:12px;font-weight:400;letter-spacing:0;color:#7a857b;display:block;margin-top:4px}main{max-width:1200px;margin:auto;padding:38px 24px}h1{font-size:32px;margin:8px 0 12px;letter-spacing:-1px}.muted{color:#7a857b;font-size:14px}.eyebrow{font-size:12px;letter-spacing:3px;color:#6b806b}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.primary{background:#315b49;color:white;border:0;padding:13px 23px;border-radius:10px}.primary:hover{background:#244637}.stats{display:flex;gap:12px;margin:28px 0}.stat{background:#e9eee4;border-radius:12px;padding:20px 25px;min-width:150px}.stat b{font-size:28px;margin-right:10px}.stat span{font-size:13px;color:#61725e}.toolbar{display:flex;align-items:center;gap:12px;margin:24px 0}input,textarea,select{border:1px solid #d8dfd4;background:white;color:#253c32;border-radius:9px;padding:12px;max-width:100%}#search{flex:1}.tabs{display:flex;gap:24px;border-bottom:1px solid #dce1d7}.tab{border:0;border-bottom:3px solid transparent;background:none;padding:14px 2px;color:#788272}.tab.active{border-color:#315b49;color:#315b49;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid #e2e6dc;border-radius:15px;overflow:hidden}.photo{width:100%;height:200px;object-fit:cover;display:block;background:#eee;cursor:zoom-in}.content{padding:17px}.box{display:inline-block;font-size:12px;color:#426149;background:#edf2e8;border-radius:6px;padding:5px 9px}.card h3{margin:12px 0 7px;font-size:17px;overflow-wrap:anywhere}.note{color:#7a857b;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:18px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:8px}.foot time{font-size:11px;color:#92998c}.remove{background:none;border:0;color:#9a624f;padding:7px 0;font-size:12px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #ccd6c5;border-radius:15px;padding:65px 20px;color:#7a857b}.empty strong{display:block;font-size:20px;color:#455e49;margin-bottom:12px}.log{background:#fff;border:1px solid #e2e6dc;padding:18px;border-radius:10px;display:flex;justify-content:space-between;gap:16px;margin-bottom:10px}.log b{margin:0 8px}.log time{color:#7a857b;font-size:13px}dialog{width:480px;max-width:calc(100% - 28px);max-height:90vh;border:0;border-radius:18px;padding:26px;color:#253c32;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#162b2466}label{display:block;font-size:14px;margin:16px 0 7px}form input:not([type=file]),textarea{width:100%}textarea{resize:vertical}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.close{border:0;background:#edf2e8;border-radius:50%;width:32px;height:32px;font-size:20px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.secondary{background:#edf1e8;border:0;border-radius:9px;padding:12px 20px;color:#456048}#preview{max-width:100%;max-height:150px;border-radius:8px;margin-top:12px}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#253c32;color:white;border-radius:10px;padding:13px 22px;z-index:10;max-width:90vw}#imageDialog{width:900px;background:#fff}#fullImage{display:block;max-width:100%;max-height:75vh;margin:12px auto;object-fit:contain}button:disabled{opacity:.5;cursor:wait}footer{text-align:center;color:#90998a;font-size:12px;margin:45px 0 10px}#status{color:#a84935;margin:14px 0}input:focus,button:focus-visible,textarea:focus,select:focus{outline:2px solid #8ca77b;outline-offset:2px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){main{padding:26px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo{height:165px}.content{padding:12px}.hero{align-items:flex-start}h1{font-size:26px}.hero .primary{padding:12px 14px;white-space:nowrap}.stats{gap:8px}.stat{min-width:0;flex:1;padding:16px 12px}.stat b{font-size:24px;display:block}.log{flex-direction:column;gap:8px}.toolbar{flex-wrap:wrap}.foot{align-items:flex-start;flex-direction:column}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style></head><body>
<header><div class="brand">▣ 归物<small>家庭小仓库 / HOME STORAGE</small></div><span class="muted">让每件物品，都有归处</span></header>
<main><section class="hero"><div><div class="eyebrow">A PLACE FOR EVERYTHING</div><h1>收好生活，随时找到。</h1><div class="muted">拍张照片，记下箱号。下次需要时，一搜就知道。</div></div><button class="primary" id="add">＋ 物品入库</button></section>
<section class="stats"><div class="stat"><b id="count">0</b><span>在库物品</span></div><div class="stat"><b id="boxes">0</b><span>使用中的箱子</span></div><div class="stat"><b id="today">0</b><span>今日入库</span></div></section>
<nav class="tabs"><button class="tab active" id="inventoryTab">物品清单</button><button class="tab" id="logsTab">操作记录</button></nav>
<div class="toolbar" id="toolbar"><input id="search" type="search" placeholder="搜索物品名称、备注或箱号…" aria-label="搜索物品"><select id="boxFilter" aria-label="按箱号筛选"><option value="">所有箱子</option></select><span class="muted" id="results"></span></div>
<div id="status" role="alert"></div><section class="grid" id="items" aria-live="polite"></section><section id="logs" hidden></section><footer>归物 · 家庭小仓库　/　把空间留给生活</footer></main>
<dialog id="addDialog"><form id="form"><div class="dialog-head"><h2>添一件，收好它</h2><button type="button" class="close" id="close" aria-label="关闭">×</button></div><p class="muted">留下照片和箱号，未来的你会感谢现在的整理。</p><label for="name">物品名称 *</label><input id="name" required maxlength="100" placeholder="例如：冬季围巾"><label for="box">放入箱号 *</label><input id="box" type="number" min="1" max="999999" step="1" required placeholder="例如：1"><label for="photo">物品照片 *</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required><p class="muted">手机可选择拍照或相册，支持 JPG / PNG / WebP，最大 10MB。</p><img id="preview" hidden alt="待入库照片预览"><label for="note">备注</label><textarea id="note" rows="2" maxlength="1000" placeholder="颜色、规格或其他帮助寻找的信息"></textarea><div id="formError" role="alert"></div><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" id="save">确认入库</button></div></form></dialog>
<dialog id="imageDialog"><div class="dialog-head"><strong id="imageTitle"></strong><button class="close" id="imageClose" aria-label="关闭照片">×</button></div><img id="fullImage" alt="物品大图"></dialog><div id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);let items=[],logs=[],photo='',view='items';let timer;
const date=s=>new Date(s).toLocaleString('zh-CN',{hour12:false});
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3500);}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Storage-Request':'1',...options.headers}});if(r.status===401)throw Error('登录已失效，请刷新页面重新登录');const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function render(){const q=$('search').value.trim().toLowerCase(),box=$('boxFilter').value;const found=items.filter(i=>(!box||String(i.box)===box)&&`${i.name} ${i.note} ${i.box}`.toLowerCase().includes(q));$('results').textContent=`${found.length} 件`;$('items').replaceChildren();if(!found.length){const n=el('div','empty');n.append(el('strong','',items.length?'没有找到匹配物品':'小仓库，准备就绪'),el('span','',items.length?'换个关键词或箱号试试。':'从第一件物品开始，点击右上角「物品入库」。'));$('items').append(n);}for(const i of found){const card=el('article','card'),img=el('img','photo');img.src='/photos/'+i.photo;img.alt=i.name;img.loading='lazy';img.tabIndex=0;img.onclick=()=>{$('imageTitle').textContent=`${i.name} · ${i.box} 号箱`;$('fullImage').src=img.src;$('imageDialog').showModal();};img.onkeydown=e=>{if(e.key==='Enter')img.click();};const content=el('div','content'),foot=el('div','foot'),remove=el('button','remove','取出 / 删除');remove.onclick=async()=>{if(!confirm(`确认从 ${i.box} 号箱取出「${i.name}」？\n库存和照片将删除，操作记录会保留。`))return;remove.disabled=true;try{await api('/api/items/'+i.id,{method:'DELETE'});await load();toast('物品已取出，记录已保留');}catch(e){toast(e.message);remove.disabled=false;}};foot.append(el('time','',date(i.created)),remove);content.append(el('span','box',`${i.box} 号箱`),el('h3','',i.name),el('div','note',i.note||'未填写备注'),foot);card.append(img,content);$('items').append(card);}}
function renderLogs(){$('logs').replaceChildren();if(!logs.length)$('logs').append(el('div','empty','还没有操作记录。'));for(const l of logs){const n=el('div','log'),label=el('div');label.append(el('span','box',l.action),el('b','',l.name),el('span','muted',`${l.box} 号箱`));n.append(label,el('time','',date(l.time)));$('logs').append(n);}}
async function load(){try{[items,logs]=await Promise.all([api('/api/items'),api('/api/logs')]);$('status').textContent='';$('count').textContent=items.length;const boxes=[...new Set(items.map(i=>i.box))].sort((a,b)=>a-b),selected=$('boxFilter').value;$('boxes').textContent=boxes.length;$('today').textContent=items.filter(i=>new Date(i.created).toDateString()===new Date().toDateString()).length;$('boxFilter').replaceChildren(new Option('所有箱子',''),...boxes.map(b=>new Option(`${b} 号箱`,b)));if(boxes.includes(Number(selected)))$('boxFilter').value=selected;render();renderLogs();}catch(e){$('status').textContent='加载失败：'+e.message;throw e;}}
function switchTab(v){view=v;$('items').hidden=v!=='items';$('toolbar').hidden=v!=='items';$('logs').hidden=v!=='logs';$('inventoryTab').classList.toggle('active',v==='items');$('logsTab').classList.toggle('active',v==='logs');if(v==='logs')load().catch(()=>{});}
$('inventoryTab').onclick=()=>switchTab('items');$('logsTab').onclick=()=>switchTab('logs');$('search').oninput=render;$('boxFilter').onchange=render;
$('add').onclick=()=>{$('form').reset();photo='';$('preview').hidden=true;$('formError').textContent='';$('addDialog').showModal();};$('close').onclick=$('cancel').onclick=()=>$('addDialog').close();$('imageClose').onclick=()=>$('imageDialog').close();
$('photo').onchange=async()=>{photo='';$('preview').hidden=true;const file=$('photo').files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){$('photo').value='';toast('请选择10MB以内的 JPG、PNG 或 WebP 照片');return;}try{photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});$('preview').src=photo;$('preview').hidden=false;}catch{toast('无法读取照片，请重试');}};
$('form').onsubmit=async e=>{e.preventDefault();if(!photo){$('formError').textContent='请等待照片读取完成或重新选择照片';return;}$('save').disabled=true;$('save').textContent='正在入库…';try{await api('/api/items',{method:'POST',body:JSON.stringify({name:$('name').value,box:$('box').value,note:$('note').value,photo})});$('addDialog').close();await load();toast('已收好，入库成功');}catch(e){$('formError').textContent=e.message;}finally{$('save').disabled=false;$('save').textContent='确认入库';}};
load().catch(()=>{});
</script></body></html>
