services:
  family-storage:
    build: .
    container_name: family-storage
    restart: unless-stopped
    ports:
      - "5178:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?请先在.env中设置至少8位密码}
      TZ: Asia/Shanghai
    volumes:
      - storage-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  storage-data:
    name: family-storage-data
